name: android-ci

on:
  pull_request:
    paths:
      - 'android-catalogue/**'
      - 'design-system/tokens/**'
      - 'design-system/scripts/**'
      - 'design-system/package.json'
  push:
    branches: [main]
    paths:
      - 'android-catalogue/**'
      - 'design-system/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-catalogue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design-system/package-lock.json

      - name: Install Style Dictionary
        working-directory: design-system
        run: npm ci

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Phase 1 will add: ./gradlew verifyPaparazziDebug for snapshot tests
      # and upload the diff PNGs as PR artefacts on failure.
