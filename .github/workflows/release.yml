name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
      tag:
        description: 'Release tag (e.g. v1.0.0) — creates a draft release'
        required: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-catalogue
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design-system/package-lock.json

      - name: Install Style Dictionary
        working-directory: design-system
        run: npm ci

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          mv catalogue/build/outputs/apk/debug/catalogue-debug.apk \
             catalogue/build/outputs/apk/debug/prisma-catalogue-${TAG}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-catalogue/catalogue/build/outputs/apk/debug/prisma-catalogue-*.apk

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-catalogue
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: design-system/package-lock.json

      - name: Install Style Dictionary
        working-directory: design-system
        run: npm ci

      - name: Generate tokens
        working-directory: design-system
        run: npm run build-tokens

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Prisma.xcodeproj \
            -scheme Prisma \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions || \
          xcodebuild build \
            -project Prisma.xcodeproj \
            -scheme Prisma \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip .app bundle
        run: |
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -1)
          zip -r "prisma-catalogue-${TAG}-simulator.zip" "$APP_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios-catalogue/prisma-catalogue-*-simulator.zip

  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            artifacts/android-apk/*.apk
            artifacts/ios-simulator-app/*.zip
