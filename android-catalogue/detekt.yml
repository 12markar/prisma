# Prisma Detekt configuration.
# Inherits from buildUponDefaultConfig (set in root build.gradle.kts) — these
# entries override defaults. Compose conventions need a softer touch than
# vanilla Kotlin (PascalCase for @Composable, magic numbers in UI code).

build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  LongMethod:
    threshold: 150
  LongParameterList:
    functionThreshold: 12
    constructorThreshold: 12
  CyclomaticComplexMethod:
    threshold: 18
  TooManyFunctions:
    thresholdInClasses: 30
    thresholdInFiles: 40

style:
  MaxLineLength:
    maxLineLength: 200
    excludes: ['**/PrismaTokens.kt']
  MagicNumber:
    active: false
  ForbiddenComment:
    active: false
  ReturnCount:
    max: 6
  WildcardImport:
    active: false

naming:
  FunctionNaming:
    active: false               # @Composable functions follow PascalCase by convention
  TopLevelPropertyNaming:
    active: false
  FunctionParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'

# Note: slack/compose-lints rules become active automatically via
# detektPlugins(libs.slack.compose.lints) — no config block needed here.
