# Prisma SwiftLint configuration.

excluded:
  - .build
  - DerivedData
  - Sources/CoreUI/Tokens          # Generated — do not lint
  - .swiftpm

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

disabled_rules:
  - todo                       # We use TODO comments deliberately during phase build
  - line_length                # Some token lines are unavoidably long; checked at file level
  - trailing_comma             # Conflicts with multi-line literals

line_length:
  warning: 140
  error: 200

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 500
  error: 1000

cyclomatic_complexity:
  warning: 12
  error: 20

# Custom rules — SwiftUI-specific patterns we care about.
custom_rules:
  no_image_systemname:
    name: "Prefer SFSafeSymbols"
    regex: 'Image\(systemName:'
    message: "Use Image(systemSymbol:) from SFSafeSymbols for compile-time safe SF Symbols."
    severity: warning

  no_force_unwrap_optional_chain:
    name: "Avoid trailing force unwrap"
    regex: '\?\.[a-zA-Z]+!'
    message: "Avoid force-unwrapping the result of an optional chain — use guard let / if let."
    severity: warning
