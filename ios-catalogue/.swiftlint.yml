# Prisma SwiftLint configuration.

excluded:
  - .build
  - DerivedData
  - .swiftpm
  - Sources/CoreUI/Tokens/PrismaTokens.swift   # Generated — do not lint
  - Prisma.xcodeproj
  - App/Generated

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

disabled_rules:
  - todo                       # We use TODO comments deliberately during phase build
  - line_length                # Some token lines are unavoidably long
  - trailing_comma             # Conflicts with multi-line literals
  - identifier_name            # Allow short names (q, x, y, t) in math/local scopes

function_body_length:
  warning: 100
  error: 150

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 600
  error: 1200

cyclomatic_complexity:
  warning: 14
  error: 22

# Custom rules — SwiftUI-specific patterns.
custom_rules:
  no_image_systemname:
    name: "Prefer SFSafeSymbols"
    regex: 'Image\(systemName:'
    message: "Use Image(systemSymbol:) from SFSafeSymbols for compile-time safe SF Symbols."
    severity: warning
