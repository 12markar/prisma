name: Prisma
options:
  bundleIdPrefix: xyz.ksharma.prisma
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    # CODE_SIGNING_ALLOWED is left at Xcode's default (YES) so device builds
    # work via Xcode UI's automatic signing. CI passes CODE_SIGNING_ALLOWED=NO
    # on the xcodebuild command line for simulator-only builds.

packages:
  Prisma:
    path: .

targets:
  Prisma:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: Prisma
        product: CoreUI
      - package: Prisma
        product: Components
    info:
      path: App/Generated/Info.plist
      properties:
        CFBundleDisplayName: Prisma
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UIApplicationSupportsIndirectInputEvents: true
        # Server-Driven UI demo connects to ws://localhost:7331 — needs ATS
        # local-networking exception to allow cleartext on the loopback.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ksharma.prisma
        PRODUCT_NAME: Prisma
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    preBuildScripts:
      - name: Generate Prisma tokens
        script: |
          # Regenerate PrismaTokens.swift from design-system/tokens before build.
          # Soft-fails when npm is unavailable — tokens are committed to the repo,
          # so the build proceeds against the snapshot. (Xcode strips PATH; we
          # add common Homebrew/Node locations back in.)
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.nvm/versions/node/*/bin:$PATH"
          if [ -f "${SRCROOT}/../design-system/package.json" ] && command -v npm >/dev/null 2>&1; then
            cd "${SRCROOT}/../design-system" && npm run build-tokens
          else
            echo "[generate-tokens] npm not found in PATH — using committed PrismaTokens.swift snapshot."
          fi
        basedOnDependencyAnalysis: false
