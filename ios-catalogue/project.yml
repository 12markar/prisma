name: Prisma
options:
  bundleIdPrefix: xyz.ksharma.prisma
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

packages:
  Prisma:
    path: .

targets:
  Prisma:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: Prisma
        product: CoreUI
      - package: Prisma
        product: Components
    info:
      path: App/Generated/Info.plist
      properties:
        CFBundleDisplayName: Prisma
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.ksharma.prisma
        PRODUCT_NAME: Prisma
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    preBuildScripts:
      - name: Generate Prisma tokens
        script: |
          # Regenerate PrismaTokens.swift from design-system/tokens before build.
          if [ -f "${SRCROOT}/../design-system/package.json" ]; then
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            cd "${SRCROOT}/../design-system" && npm run build-tokens
          fi
        basedOnDependencyAnalysis: false
